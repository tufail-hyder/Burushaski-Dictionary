name: burushashki_dictionary
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter

  share_plus: ^13.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  audioplayers: ^6.7.1
  dio: ^5.9.2
  just_audio: ^0.10.5
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_tts: ^4.2.5

  # Utility Packages
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1

  # Icons
  iconsax_flutter: ^1.0.1

  # Fonts
  google_fonts: ^8.1.0

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/logos/app_logo.png
    - assets/onboarding_images/
    - assets/icons/ai.png

  fonts:
    - family: TimesRomanFont
      fonts:
        - asset: assets/fonts/times.ttf
        - asset: assets/fonts/times-bd.ttf
          weight: 800
        - asset: assets/fonts/times-bi.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/times-i.ttf
          style: italic

